services:
  - type: web
    name: gearflow-app
    env: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
